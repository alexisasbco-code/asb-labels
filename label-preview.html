<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ASB Labels — 2×1" print prototype</title>
<!--
  Standalone sizing prototype. NO Shopify data — this exists to nail thermal
  sizing on the ZD421 before we wire up shipments (Phase 5: catch it on label
  #1, not #200). Open on the receiving Mac, hit Print, pick the Zebra, confirm
  a scanner reads label #1, THEN we build the real app around this renderer.

  The <label-cell> render + print CSS here become the reusable label component
  in the embedded app. JsBarcode is vendored locally (offline / CSP-safe).
-->
<script src="./src/vendor/JsBarcode.all.min.js"></script>
<style>
  /* ---- Screen-only chrome (hidden when printing) ---------------------- */
  :root { --stock-w: 3.5in; --stock-h: 1.125in; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.4 -apple-system, system-ui, sans-serif; color: #1a1a1a; }
  .controls {
    position: sticky; top: 0; z-index: 10;
    background: #fff; border-bottom: 1px solid #ddd;
    padding: 14px 18px; display: flex; flex-wrap: wrap; gap: 14px 22px; align-items: center;
  }
  .controls h1 { font-size: 15px; margin: 0 12px 0 0; font-weight: 650; }
  .controls label { font-size: 13px; color: #444; display: inline-flex; gap: 6px; align-items: center; }
  .controls input, .controls select { font: inherit; padding: 4px 6px; }
  .controls input[type="number"] { width: 68px; }
  button {
    font: inherit; font-weight: 600; cursor: pointer;
    padding: 7px 16px; border: 0; border-radius: 7px; background: #202223; color: #fff;
  }
  button.secondary { background: #f1f1f1; color: #202223; border: 1px solid #ccc; }
  .hint { color: #6b7280; font-size: 12px; }

  /* ---- The label sheet ------------------------------------------------- */
  .sheet { padding: 18px; display: flex; flex-wrap: wrap; gap: 10px; background: #f6f6f7; }

  /* One physical label. Fixed to the stock size so screen == paper.
     Two zones: text left (long names + variants wrap), barcode right. */
  .label {
    width: var(--stock-w); height: var(--stock-h);
    background: #fff; border: 1px solid #e1e1e1;   /* border is screen-only, see @media print */
    padding: 0.06in 0.09in;
    display: flex; flex-direction: row; align-items: stretch; gap: 0.09in;
    overflow: hidden;
  }
  .label .text    { flex: 1 1 auto; min-width: 0;
                    display: flex; flex-direction: column; justify-content: center; gap: 0.03in; }
  .label .style   { font-weight: 700; font-size: 9.5pt; line-height: 1.12; letter-spacing: -0.1px;
                    overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical;
                    -webkit-line-clamp: 2; }
  .label .meta    { font-size: 7.5pt; color: #222; line-height: 1.15;
                    overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical;
                    -webkit-line-clamp: 2; }
  .label .barcode { flex: 0 0 1.7in; min-width: 0;
                    display: flex; align-items: center; justify-content: center; }
  .label .barcode svg { width: 100%; height: 100%; }
  .label .missing { flex: 0 0 1.7in; display: flex; align-items: center; justify-content: center;
                    color: #b00; font-size: 8pt; font-weight: 600; text-align: center;
                    border: 1px dashed #e0a; border-radius: 4px; }

  /* ---- Print: only labels, exact stock size, one label per page ------- */
  @media print {
    .controls { display: none !important; }
    .sheet { padding: 0; gap: 0; background: #fff; display: block; }
    @page { size: var(--stock-w) var(--stock-h); margin: 0; }
    .label {
      border: 0;                       /* no visible border on thermal */
      page-break-after: always;
      break-after: page;
      width: var(--stock-w); height: var(--stock-h);
    }
    .label:last-child { page-break-after: auto; break-after: auto; }
  }
</style>
</head>
<body>
  <div class="controls">
    <h1>ASB Labels — sizing prototype</h1>
    <label>Stock
      <select id="stock">
        <option value="3.5x1.125" selected>3-1/2 × 1-1/8 in (ours)</option>
        <option value="2x1">2 × 1 in</option>
        <option value="2.25x1.25">2.25 × 1.25 in</option>
        <option value="4x2">4 × 2 in</option>
      </select>
    </label>
    <label>Bar width
      <input id="barw" type="number" min="0.6" max="3" step="0.1" value="2" />
    </label>
    <label>Show text under bars
      <input id="showval" type="checkbox" checked />
    </label>
    <button onclick="window.print()">Print</button>
    <button class="secondary" onclick="render()">Re-render</button>
    <span class="hint">Sample data only. Each accepted unit = one label. Scan label&nbsp;#1 before a full run.</span>
  </div>

  <div class="sheet" id="sheet"></div>

<script>
  // --- Sample rows: stand in for shipment line items. -------------------
  // Each row = one variant with an accepted quantity. `qty` labels get
  // printed. `barcode` is the UPC that becomes the Code128; blank = flagged.
  // Realistic worst cases: long product names + 2–3 long variant values + SKU.
  const SAMPLE_ROWS = [
    { style: "The 3p Fulfilled Snowboard",                        meta: "155cm · Wide · Midnight Blue · SNB-3PF-155W",  barcode: "190910123456", qty: 2 },
    { style: "Patagonia Women's Down Sweater Hoody Insulated",    meta: "Pigeon Blue · Medium · PAT-DSH-W-PB-M",        barcode: "889587654321", qty: 2 },
    { style: "Smartwool Hike Light Cushion Crew",                 meta: "Grey · L · SW-HLC-GRY-L",                      barcode: "042000998877", qty: 1 },
    { style: "Nordica Speedmachine 3 130 S GW Ski Boots",         meta: "27.5 · Black/Anthracite/Red · NOR-SM3-275",    barcode: "827569483726", qty: 1 },
    { style: "Darn Tough Hiker",                                  meta: "Olive · S · DT-HKR-S",                         barcode: "",             qty: 1 }, // <- missing barcode
  ];

  const STOCK = {
    "3.5x1.125": ["3.5in", "1.125in"],   // our stock (1-1/8" × 3-1/2")
    "2x1":       ["2in",   "1in"],
    "2.25x1.25": ["2.25in","1.25in"],
    "4x2":       ["4in",   "2in"],
  };

  function render() {
    const [w, h] = STOCK[document.getElementById("stock").value];
    document.documentElement.style.setProperty("--stock-w", w);
    document.documentElement.style.setProperty("--stock-h", h);

    const barWidth = parseFloat(document.getElementById("barw").value) || 1.4;
    const showVal = document.getElementById("showval").checked;

    const sheet = document.getElementById("sheet");
    sheet.innerHTML = "";

    // Expand each row to one label per accepted unit.
    for (const row of SAMPLE_ROWS) {
      for (let i = 0; i < row.qty; i++) {
        sheet.appendChild(labelCell(row, barWidth, showVal));
      }
    }
  }

  // Build one label. This is the piece that gets reused in the real app:
  // feed it a { style, meta, barcode } and it renders a print-ready cell.
  function labelCell(row, barWidth, showVal) {
    const el = document.createElement("div");
    el.className = "label";

    // Left zone: name (2 lines max) + variants/SKU (2 lines max).
    const text = document.createElement("div");
    text.className = "text";
    const style = document.createElement("div");
    style.className = "style";
    style.textContent = row.style || "—";
    text.appendChild(style);
    const meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = row.meta || "";
    text.appendChild(meta);
    el.appendChild(text);

    // Right zone: the barcode.
    if (row.barcode && String(row.barcode).trim()) {
      const wrap = document.createElement("div");
      wrap.className = "barcode";
      const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      wrap.appendChild(svg);
      el.appendChild(wrap);
      try {
        JsBarcode(svg, String(row.barcode).trim(), {
          format: "CODE128",
          width: barWidth,      // module (bar) width in px — tune for scan reliability
          height: 48,
          margin: 0,
          displayValue: showVal,
          fontSize: 13,
          textMargin: 2,
        });
        // JsBarcode emits fixed pixel width/height and no viewBox, so CSS
        // scaling distorts. Convert to a viewBox so it scales cleanly.
        const w = svg.getAttribute("width");
        const h = svg.getAttribute("height");
        if (w && h) {
          svg.setAttribute("viewBox", `0 0 ${w} ${h}`);
          svg.removeAttribute("width");
          svg.removeAttribute("height");
          svg.setAttribute("preserveAspectRatio", "xMidYMid meet");
        }
      } catch (e) {
        wrap.className = "missing";
        wrap.textContent = "⚠ bad barcode";
      }
    } else {
      const miss = document.createElement("div");
      miss.className = "missing";
      miss.textContent = "⚠ NO BARCODE";
      el.appendChild(miss);
    }
    return el;
  }

  document.getElementById("stock").addEventListener("change", render);
  document.getElementById("barw").addEventListener("change", render);
  document.getElementById("showval").addEventListener("change", render);
  render();
</script>
</body>
</html>
