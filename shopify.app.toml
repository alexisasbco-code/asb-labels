# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

name = "asb-labels"
application_url = "https://alexisasbco-code.github.io/asb-labels/"
embedded = true
client_id = "50edfaf57785eda5b7c6074a6e1a9b63"

[build]
# Off so `shopify app dev` can't overwrite the production URL above.
# (Dev still works — say NO if the CLI asks to update URLs.)
automatically_update_urls_on_dev = false

[webhooks]
api_version = "2026-10"

[access.admin]
direct_api_mode = "online"
embedded_app_direct_api_access = true

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
# Same read set as asb-bins, plus read_inventory_shipments (scope-gated schema:
# without it, inventoryShipment(s) queries literally vanish from QueryRoot).
scopes = "read_products,read_inventory,read_locations,read_inventory_transfers,read_inventory_shipments"
optional_scopes = [ ]
use_legacy_install_flow = false

[auth]
redirect_urls = [ "https://alexisasbco-code.github.io/asb-labels/" ]
