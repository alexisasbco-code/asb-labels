<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ASB Labels</title>
  <!-- App Bridge needs the app's client_id; Shopify CLI injects it via
       SHOPIFY_API_KEY when running `shopify app dev` (see vite.config.js). -->
  <meta name="shopify-api-key" content="%SHOPIFY_API_KEY%" />
  <script src="https://cdn.shopify.com/shopifycloud/app-bridge.js"></script>
  <script src="/vendor/JsBarcode.all.min.js"></script>
  <link rel="stylesheet" href="/src/styles.css" />
</head>
<body>
  <div id="app"></div>
  <!-- Print target: filled with .label cells right before window.print() -->
  <div id="print-sheet" class="print-sheet" aria-hidden="true"></div>
  <script type="module" src="/src/app.js"></script>
</body>
</html>
